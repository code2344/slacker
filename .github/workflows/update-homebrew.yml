
name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: code2344/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true

      - name: Download release source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" \
            --repo code2344/slacker \
            --archive tar.gz \
            --output source.tar.gz

          echo "SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)" \
            >> "$GITHUB_ENV"

      - name: Generate Homebrew formula
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p tap/Formula

          cat > tap/Formula/slacker.rb <<EOF
          class Slacker < Formula
            desc "Keyboard-driven Slack terminal client"
            homepage "https://github.com/code2344/slacker"
            url "https://github.com/code2344/slacker/archive/refs/tags/${TAG}.tar.gz"
            sha256 "${SHA256}"
            license "GPL-3.0-only"

            depends_on "go" => :build

            def install
              system "go", "build", *std_go_args(output: bin/"slacker"), "."
            end

            test do
              assert_match "slacker", shell_output("#{bin}/slacker --help")
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/slacker.rb

          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi

          git commit -m "Update slacker to ${TAG}"
          git push
